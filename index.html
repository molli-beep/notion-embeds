<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtually Molli — Footer Embeds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --vm-text:         #2e2828;
      --vm-text-soft:    #6b5f5f;
      --vm-accent:       #9b5b5c;
      --vm-accent-hover: #7f4748;
      --vm-rule:         #ecd5cf;
      --vm-btn-ghost-bg: #f9eeec;
      --vm-radius:       6px;
    }
    body {
      margin: 0;
      background: #faf6f5;
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .vm-index {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .vm-index h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--vm-accent);
      margin: 0 0 8px;
    }
    .vm-index p {
      font-size: 14px;
      color: var(--vm-text-soft);
      line-height: 1.6;
      margin: 0 0 28px;
    }
    .vm-index ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .vm-index a {
      display: block;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--vm-accent);
      background: var(--vm-btn-ghost-bg);
      padding: 14px 20px;
      border-radius: var(--vm-radius);
      text-decoration: none;
      transition: background 0.18s ease, color 0.18s ease;
    }
    .vm-index a:hover {
      background: #f0ddd9;
      color: var(--vm-accent-hover);
    }
  </style>
</head>
<body>
  <div class="vm-index">
    <h1>Footer Embeds</h1>
    <p>Notion embed footers by Virtually Molli.</p>
    <ul>
      <li><a href="/utm-link-builder/">UTM Link Builder</a></li>
      <li><a href="/second-brain/">Second Brain + Brain Dump Automation</a></li>
      <li><a href="/workflow-triage/">Workflow Triage Tool</a></li>
      <li><a href="/workflowaudit-gptprompt/">DIY Workflow Audit (GPT Prompt)</a></li>
    </ul>
  </div>
</body>
</html>
